<svg xmlns="http://www.w3.org/2000/svg" width="100vw" height="100vh" viewBox="0 0 1600 1020" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6750a4"/>
    </marker>
    <style>
      .bg{fill:#f6f2f8}.title{font:700 30px Arial,sans-serif;fill:#211d29}.sub{font:15px Arial,sans-serif;fill:#625d67}
      .box{fill:#fff;stroke:#d8cce4;stroke-width:2;rx:14}.head{fill:#6750a4;rx:14}
      .table{font:700 19px Arial,sans-serif;fill:#fff}.field{font:14px Arial,sans-serif;fill:#292431}
      .key{font-weight:700;fill:#6750a4}.rel{fill:none;stroke:#6750a4;stroke-width:2.5;marker-end:url(#arrow)}
      .optional{fill:none;stroke:#876cb5;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .cardinality{font:12px Arial,sans-serif;fill:#625d67}.note{font:13px Arial,sans-serif;fill:#625d67}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1020"/>
  <text class="title" x="60" y="58">TOEIC Reading — Database schema</text>
  <text class="sub" x="60" y="86">SQL Server · exams, nested reading questions, learner attempts, and answer records</text>

  <g>
    <rect class="box" x="60" y="120" width="360" height="250"/>
    <rect class="head" x="60" y="120" width="360" height="48"/>
    <text class="table" x="82" y="151">Exams</text>
    <text class="field" x="82" y="198"><tspan class="key">PK</tspan>  Id</text>
    <text class="field" x="82" y="226">Title · DurationMinutes</text>
    <text class="field" x="82" y="254">IsPublished · CreatedAtUtc</text>
    <text class="field" x="82" y="282">PublishedAtUtc (nullable)</text>
    <text class="field" x="82" y="326">Index: Title</text>
  </g>
  <g>
    <rect class="box" x="510" y="120" width="390" height="250"/>
    <rect class="head" x="510" y="120" width="390" height="48"/>
    <text class="table" x="532" y="151">ExamParts</text>
    <text class="field" x="532" y="198"><tspan class="key">PK</tspan>  Id</text>
    <text class="field" x="532" y="226"><tspan class="key">FK</tspan>  ExamId → Exams.Id</text>
    <text class="field" x="532" y="254">Number · ShuffleQuestions</text>
    <text class="field" x="532" y="282">ShuffleAnswers</text>
    <text class="field" x="532" y="326">Unique: (ExamId, Number)</text>
  </g>
  <g>
    <rect class="box" x="1050" y="120" width="440" height="278"/>
    <rect class="head" x="1050" y="120" width="440" height="48"/>
    <text class="table" x="1072" y="151">Passages</text>
    <text class="field" x="1072" y="198"><tspan class="key">PK</tspan>  Id</text>
    <text class="field" x="1072" y="226"><tspan class="key">FK</tspan>  ExamPartId → ExamParts.Id</text>
    <text class="field" x="1072" y="254">SourceId · Content</text>
    <text class="field" x="1072" y="282">ShuffleQuestions · ShuffleAnswers</text>
    <text class="field" x="1072" y="326">Unique: (ExamPartId, SourceId)</text>
  </g>
  <g>
    <rect class="box" x="60" y="530" width="390" height="250"/>
    <rect class="head" x="60" y="530" width="390" height="48"/>
    <text class="table" x="82" y="561">Attempts</text>
    <text class="field" x="82" y="608"><tspan class="key">PK</tspan>  Id</text>
    <text class="field" x="82" y="636"><tspan class="key">FK</tspan>  ExamId → Exams.Id</text>
    <text class="field" x="82" y="664">CandidateId · StartedAtUtc</text>
    <text class="field" x="82" y="692">SubmittedAtUtc (nullable)</text>
    <text class="field" x="82" y="736">Index: (ExamId, CandidateId)</text>
  </g>
  <g>
    <rect class="box" x="510" y="430" width="450" height="322"/>
    <rect class="head" x="510" y="430" width="450" height="48"/>
    <text class="table" x="532" y="461">Questions</text>
    <text class="field" x="532" y="508"><tspan class="key">PK</tspan>  Id</text>
    <text class="field" x="532" y="536"><tspan class="key">FK</tspan>  ExamPartId → ExamParts.Id</text>
    <text class="field" x="532" y="564"><tspan class="key">FK</tspan>  PassageId → Passages.Id (nullable)</text>
    <text class="field" x="532" y="592">Number · Prompt · CorrectChoiceKey</text>
    <text class="field" x="532" y="620">Hint · ShuffleChoices</text>
    <text class="field" x="532" y="676">Unique: (ExamPartId, Number)</text>
  </g>
  <g>
    <rect class="box" x="1050" y="470" width="440" height="210"/>
    <rect class="head" x="1050" y="470" width="440" height="48"/>
    <text class="table" x="1072" y="501">Choices</text>
    <text class="field" x="1072" y="548"><tspan class="key">PK</tspan>  Id</text>
    <text class="field" x="1072" y="576"><tspan class="key">FK</tspan>  ExamQuestionId → Questions.Id</text>
    <text class="field" x="1072" y="604">Key · Content · Position</text>
    <text class="field" x="1072" y="648">Unique: (ExamQuestionId, Key)</text>
  </g>
  <g>
    <rect class="box" x="1050" y="760" width="440" height="210"/>
    <rect class="head" x="1050" y="760" width="440" height="48"/>
    <text class="table" x="1072" y="791">AttemptAnswers</text>
    <text class="field" x="1072" y="838"><tspan class="key">PK</tspan>  Id</text>
    <text class="field" x="1072" y="866"><tspan class="key">FK</tspan>  ExamAttemptId → Attempts.Id</text>
    <text class="field" x="1072" y="894"><tspan class="key">FK</tspan>  ExamQuestionId → Questions.Id</text>
    <text class="field" x="1072" y="922">SelectedChoiceKey (nullable) · IsCorrect</text>
    <text class="field" x="1072" y="950">Unique: (ExamAttemptId, ExamQuestionId)</text>
  </g>

  <path class="rel" d="M420 200H510"/>
  <text class="cardinality" x="432" y="188">1 : many</text>
  <path class="rel" d="M900 200H1050"/>
  <text class="cardinality" x="928" y="188">1 : many</text>
  <path class="rel" d="M690 370V430"/>
  <text class="cardinality" x="700" y="405">1 : many</text>
  <path class="optional" d="M1050 340H1000V520H960"/>
  <text class="cardinality" x="963" y="330">1 : many</text>
  <path class="rel" d="M960 540H1050"/>
  <text class="cardinality" x="970" y="528">1 : many</text>
  <path class="rel" d="M240 370V530"/>
  <text class="cardinality" x="250" y="455">1 : many</text>
  <path class="rel" d="M450 650H990V860H1050"/>
  <text class="cardinality" x="640" y="638">1 : many</text>
  <path class="rel" d="M800 752V900H1050"/>
  <text class="cardinality" x="812" y="780">1 : many</text>

  <text class="note" x="60" y="930">Solid connectors: required foreign keys · Dashed: Passage 1-to-many Questions; each Question has 0..1 Passage (nullable PassageId).</text>
</svg>
